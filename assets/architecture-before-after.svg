<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">ContactIQ deployment architecture before and after remediation</title>
<desc id="desc">Before remediation, static frontend traffic bypassed Express. After remediation, frontend and API traffic pass through unified Express serving.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.s{font-size:18px;font-weight:700}.b{font-size:15px}.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:2}.risk{fill:#fff1f0;stroke:#cf222e;stroke-width:2}.fixed{fill:#dafbe1;stroke:#1a7f37;stroke-width:2}.line{stroke:#57606a;stroke-width:3;fill:none}.dash{stroke:#cf222e;stroke-width:3;stroke-dasharray:8 6;fill:none}
</style>
<rect width="1200" height="520" rx="18" fill="white"/>
<text x="40" y="50" class="h">Before: frontend bypassed Express security middleware</text>
<rect class="box" x="50" y="100" width="150" height="75" rx="12"/><text x="92" y="145" class="s">Browser</text>
<rect class="risk" x="290" y="85" width="260" height="105" rx="12"/><text x="330" y="125" class="s">Replit static frontend</text><text x="330" y="155" class="b">React served outside Express</text>
<rect class="box" x="290" y="230" width="260" height="105" rx="12"/><text x="365" y="270" class="s">Express API</text><text x="335" y="300" class="b">Security middleware applied here</text>
<path class="dash" d="M200 130 H290"/><path class="line" d="M200 150 C240 150 240 282 290 282"/>
<text x="590" y="138" class="b">Frontend response path did not traverse Express</text>
<text x="40" y="405" class="h">After: unified Express security boundary</text>
<rect class="box" x="50" y="435" width="150" height="60" rx="12"/><text x="92" y="472" class="s">Browser</text>
<rect class="box" x="275" y="435" width="160" height="60" rx="12"/><text x="310" y="472" class="s">Replit Edge</text>
<rect class="fixed" x="510" y="420" width="270" height="90" rx="12"/><text x="555" y="458" class="s">Unified Express server</text><text x="550" y="486" class="b">Frontend + API security boundary</text>
<rect class="box" x="855" y="405" width="140" height="60" rx="12"/><text x="875" y="442" class="s">React frontend</text>
<rect class="box" x="855" y="475" width="140" height="35" rx="12"/><text x="892" y="499" class="b">API routes</text>
<path class="line" d="M200 465 H275 M435 465 H510 M780 450 H855 M780 480 H855"/>
</svg>